#Env Var - 12
#PORT, ACTIVE_PROFILE, MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD,
#MYSQL_DB, SHOW_SQL,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,MSG91_AUTH_KEY,MSG91_TEMPLATE_ID,
# AWS_ACCESS_KEY,AWS_REGION=ap-south-1,AWS_S3_BUCKET_NAME,AWS_SECRET_KEY
#------------------------------------------------------------------------------------------------------------------
#spring.mvc.contentnegotiation.favor-path-extension=false
#spring.mvc.contentnegotiation.favor-parameter=false
#spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.default-content-type=application/json
#------------------------------------------------------------------------------------------------------------------
info.app.name=Skoolish App
info.app.description=School Management Application
info.app.version=1.0.0
#------------------------------------------------------------------------------------------------------------------
# SERVER CONFIGURATION
server.port=${PORT:8080}
server.servlet.context-path=/st
#Default HTTP session time out
server.servlet.session.timeout=15m
#------------------------------------------------------------------------------------------------------------------
# Spring Application Properties
spring.application.name=schooltech
spring.profiles.active=${ACTIVE_PROFILE:dev}
#------------------------------------------------------------------------------------------------------------------
#flyway
flyway.placeholders.MYSQL_HOST=${MYSQL_HOST:localhost}
spring.flyway.repair=false
spring.flyway.enabled=true
#------------------------------------------------------------------------------------------------------------------
# Redis Configuration
#spring.redis.host=localhost
#spring.redis.port=6379
#------------------------------------------------------------------------------------------------------------------
# Data Rest Configuration
spring.data.rest.base-path=/api
spring.data.rest.default-page-size=10
#------------------------------------------------------------------------------------------------------------------
# Datasource Configuration
spring.datasource.master.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:stmaster}
spring.datasource.master.username=${MYSQL_USER:root}
spring.datasource.master.password=${MYSQL_PASSWORD:root}
#
#---------------------------------------------------------JPA Configuration---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
#
#---------------------------------------------------------Spring Main Configuration-----------------------------------------------------
spring.main.banner-mode=off
#
#--------------------------------------------------------Springdoc API Docs Path----------------------------------------------------------
#springdoc.api-docs.path=/api-docs  --Need to be removed after swagger testing
#------------------------------------------------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
otp.expiration=5
#--------------------------------------------------------SMS----------------------------------------------------------
msg91.auth-key=${MSG91_AUTH_KEY}
msg91.template-id=${MSG91_TEMPLATE_ID}
msg91.otp-url=https://control.msg91.com/api/v5/otp
msg91.otp-url-verify=https://control.msg91.com/api/v5/otp/verify
msg91.otp-expiry-minutes=5
msg91.real-time-response=1
msg91.sms-url=https://control.msg91.com/api/v5/flow
msg91.attendance-template-id=${MSG91_ATTENDANCE_TEMPLATE_ID}
#-----------------------------------------------------------AWS S3 -------------------------------------------------------
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET_NAME}
#
#------------------------------------------------------------MULTI PART FILE------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#
#------------------------------------------------------------DOWNLOAD LOGS------------------------------------------------------
logging.file.name=logs/schooltech.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

